[project]
name = "pyloggi"
version = "0.1.0"
description = "A Simple Python logging package with pre-build logging constructors ready to use"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
